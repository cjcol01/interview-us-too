<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>502 — Briefly Offline | InterviewWise</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0C; --card: #111114; --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.16); --text-1: #ECECEE; --text-2: #9C9CA6;
    --text-3: #67676F; --accent: #C6F24E; --danger: #E06A6A;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #FBFBF9; --card: #FFFFFF; --line: rgba(20,20,18,.10);
      --line-strong: rgba(20,20,18,.22); --text-1: #1A1A18; --text-2: #5C5C58;
      --text-3: #8A8A84; --accent: #3F6212; --danger: #C0392B;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text-1);
    font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 18px;
  }
  .wrap { max-width: 520px; width: 100%; text-align: center; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text-3); margin-bottom: 22px;
  }
  .badge {
    background: rgba(224,106,106,.10); border: 1px solid rgba(224,106,106,.28); color: var(--danger);
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px;
    border-radius: 6px; font-size: 11px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700;
    margin: 0 0 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 26px 22px; margin-top: 24px;
  }
  p { font-size: 14.5px; line-height: 1.7; color: var(--text-2); margin: 0 0 14px; }
  p:last-child { margin-bottom: 0; }
  .dots::after {
    content: '.'; animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; }
  }
  .footer-note {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3);
    margin-top: 26px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">
      <span class="badge">Error 502</span>
      <span>&middot;</span>
      <span>Bad Gateway</span>
    </div>
    <h1>We're mid-deploy<span class="dots"></span></h1>
    <div class="card">
      <p>InterviewWise is redeploying and will be back in under 10 seconds. This isn't a broken link — the server's just restarting.</p>
      <p>This page will reload on its own once we're back.</p>
    </div>
    <p class="footer-note">Error 502 &mdash; Bad Gateway</p>
  </div>
  <script>
    (function poll() {
      setTimeout(function () {
        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { if (r.ok) location.reload(); else poll(); })
          .catch(poll);
      }, 3000);
    })();
  </script>
</body>
</html>
