{% extends "base.html" %}
{% block title %}Sign in &mdash; InterviewAce{% endblock %}
{% block head %}<link rel="stylesheet" href="/css/login.css">{% endblock %}
{% block content %}
  <div class="login-wrap">
    <a class="login-logo" href="/">InterviewAce</a>

    <div class="card">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Sign in</div>
        <div class="tab" onclick="switchTab('register')">Create account</div>
      </div>

      <form id="login-form" class="form active" method="post" onsubmit="handleSubmit(event, 'login')">
        <div>
          <label>Username</label>
          <input type="text" name="username" autocomplete="username" required>
        </div>
        <div>
          <label>Password</label>
          <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="error-msg"></div>
        <button type="submit">Sign in</button>
      </form>

      <form id="register-form" class="form" method="post" onsubmit="handleSubmit(event, 'register')">
        <div>
          <label>Full Name</label>
          <input type="text" name="full_name" autocomplete="name" required>
        </div>
        <div>
          <label>Username</label>
          <input type="text" name="username" autocomplete="username" required>
        </div>
        <div>
          <label>Email</label>
          <input type="email" name="email" autocomplete="email" required>
        </div>
        <div>
          <label>Password</label>
          <input type="password" name="password" autocomplete="new-password" required>
        </div>
        <div id="register-error" class="error-msg"></div>
        <button type="submit">Create account</button>
      </form>
    </div>

    <p class="login-footer">
      <a href="/">← Back to home</a>
    </p>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) =>
        t.classList.toggle('active', (i === 0) === (tab === 'login'))
      );
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('register-form').classList.toggle('active', tab === 'register');
      document.getElementById('login-error').textContent = '';
      document.getElementById('register-error').textContent = '';
    }

    async function handleSubmit(e, action) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type=submit]');
      const errEl = document.getElementById(action + '-error');
      const data = Object.fromEntries(new FormData(form));

      btn.disabled = true;
      errEl.textContent = '';

      try {
        const res = await fetch('/auth/' + action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!res.ok) {
          errEl.textContent = json.detail || 'Something went wrong.';
        } else {
          window.location.href = '/app';
        }
      } catch (err) {
        errEl.textContent = 'Network error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
{% endblock %}
