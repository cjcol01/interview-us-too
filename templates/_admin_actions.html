{% macro action_buttons(e, return_to) %}
<div class="ua-actions">
  <form method="post" action="/admin/users/{{ e.id }}/warn">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ua-btn ua-btn-notice">Send warning</button>
  </form>
  {% if e.is_paused %}
  <form method="post" action="/admin/users/{{ e.id }}/resume-subscription" onsubmit="return confirm('Resume billing for {{ e.email }}?');">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ua-btn ua-btn-ok">Resume subscription</button>
  </form>
  {% else %}
  <form method="post" action="/admin/users/{{ e.id }}/pause-subscription" onsubmit="return confirm('Pause the Stripe subscription for {{ e.email }}? This stops billing and downgrades their access immediately.');">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ua-btn ua-btn-caution" {% if not e.has_sub %}disabled title="No active subscription"{% endif %}>Pause subscription</button>
  </form>
  {% endif %}
  {% if e.is_active %}
  <form method="post" action="/admin/users/{{ e.id }}/ban" onsubmit="return confirm('Ban {{ e.email }}? This immediately blocks login and API access.');">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ua-btn ua-btn-danger">Ban</button>
  </form>
  {% else %}
  <form method="post" action="/admin/users/{{ e.id }}/unban" onsubmit="return confirm('Unban {{ e.email }}? This restores login and API access.');">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ua-btn ua-btn-ok">Unban</button>
  </form>
  {% endif %}
</div>
{% endmacro %}
