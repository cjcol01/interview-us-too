<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Screen Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/typescript.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #141414;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 0.9rem; font-weight: 600; color: #bbb; }

    #monitor-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #1e1e1e;
      color: #555;
      display: none;
    }
    #monitor-badge.left  { background: #1a2a3a; color: #5b9bd5; display: inline; }
    #monitor-badge.right { background: #2a1a3a; color: #a07ad5; display: inline; }

    #status {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1e1e1e;
      color: #555;
    }
    #status.live { background: #0f2a0f; color: #4caf50; }
    #status.working { background: #2a2200; color: #c8a000; }

    .header-right { display: flex; align-items: center; gap: 8px; position: relative; }

    #menu-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    #menu-btn:hover { color: #aaa; }

    #dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      min-width: 140px;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #dropdown.open { display: block; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      font-size: 0.88rem;
      color: #bbb;
      cursor: pointer;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background 0.1s;
    }
    .dropdown-item:hover { background: #222; color: #e0e0e0; }
    .dropdown-item.danger { color: #e06c75; }
    .dropdown-item.danger:hover { background: #2a1515; }

    main { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    #screenshot-wrap {
      background: #141414;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #222;
      position: relative;
      cursor: pointer;
    }

    /* minimised: fixed height thumbnail */
    #screenshot-wrap.mini { height: 90px; }
    #screenshot-wrap.mini #screenshot { height: 90px; width: 100%; object-fit: cover; object-position: top left; }

    /* expanded: full image */
    #screenshot-wrap.expanded #screenshot { height: auto; width: 100%; }

    #screenshot {
      display: block;
      transition: height 0.2s ease;
    }
    #screenshot.hidden { display: none; }

    /* expand hint overlay on mini */
    #screenshot-wrap.mini::after {
      content: 'tap to expand';
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }

    #placeholder {
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #333;
    }
    #placeholder svg { opacity: 0.3; }
    #placeholder span { font-size: 0.75rem; }

    #analysis-card {
      background: #141414;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #222;
    }

    .analysis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    #analysis-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
    }

    .complexity-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .complexity-btn {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #888;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      user-select: none;
    }
    .complexity-btn:active { background: #2a2a2a; }
    .complexity-btn:disabled { opacity: 0.3; cursor: default; }

    .complexity-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .complexity-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.15s;
    }
    .complexity-dot.active { background: #5b9bd5; }

    #analysis {
      font-size: 1.05rem;
      line-height: 1.65;
      color: #ccc;
      min-height: 2rem;
    }

    #analysis:empty::before, #analysis.empty::before {
      content: 'Waiting for capture...';
      color: #383838;
      font-style: italic;
      font-size: 0.9rem;
    }

    #analysis pre {
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      overflow-x: auto;
      margin: 10px 0;
    }

    #analysis pre code.hljs {
      font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
      font-size: 0.92rem;
      line-height: 1.55;
      border-radius: 6px;
      padding: 12px 14px;
    }

    #analysis code {
      font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
      font-size: 0.9rem;
      background: #1c1c1c;
      color: #e06c75;
      padding: 1px 5px;
      border-radius: 3px;
    }

    #analysis p { margin: 6px 0; }
    #analysis ul, #analysis ol { padding-left: 1.4em; margin: 6px 0; }
    #analysis li { margin: 3px 0; }
    #analysis strong { color: #e0e0e0; }

    #timestamp {
      font-size: 0.68rem;
      color: #383838;
      margin-top: 10px;
    }

  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Screen Monitor</h1>
      <span id="monitor-badge"></span>
    </div>
    <div class="header-right">
      <span id="status">connecting...</span>
      <button id="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
      </button>
      <div id="dropdown">
        <a class="dropdown-item" href="/settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </a>
        <form method="post" action="/auth/logout" style="display:contents">
          <button type="submit" class="dropdown-item danger">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sign Out
          </button>
        </form>
      </div>
    </div>
  </header>

  <main>
    <div id="screenshot-wrap" class="mini" onclick="toggleImage()">
      <div id="placeholder">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2" y="4" width="20" height="14" rx="2"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
        <span>waiting for capture...</span>
      </div>
      <img id="screenshot" class="hidden" alt="latest screenshot" />
    </div>

    <div id="analysis-card">
      <div class="analysis-header">
        <div id="analysis-label">AI Analysis</div>
        <div class="complexity-control">
          <button class="complexity-btn" id="complexity-down" onclick="postComplexity('down')">&minus;</button>
          <div class="complexity-dots">
            <div class="complexity-dot" id="dot-1"></div>
            <div class="complexity-dot" id="dot-2"></div>
            <div class="complexity-dot" id="dot-3"></div>
          </div>
          <button class="complexity-btn" id="complexity-up" onclick="postComplexity('up')">+</button>
        </div>
      </div>
      <div id="analysis" class="empty"></div>
      <div id="timestamp"></div>
    </div>
  </main>

  <script>
    const statusEl   = document.getElementById('status');
    const imgEl      = document.getElementById('screenshot');
    const phEl       = document.getElementById('placeholder');
    const analysisEl = document.getElementById('analysis');
    const tsEl       = document.getElementById('timestamp');
    const badgeEl    = document.getElementById('monitor-badge');

    const wrapEl = document.getElementById('screenshot-wrap');

    function applyCapture(data) {
      if (data.capture_id > 0) {
        imgEl.src = '/screenshot?t=' + data.capture_id;
        imgEl.classList.remove('hidden');
        phEl.style.display = 'none';
      }
      analysisEl.innerHTML = data.analysis ? marked.parse(data.analysis) : '';
      analysisEl.classList.toggle('empty', !data.analysis);
      tsEl.textContent = data.timestamp ? 'captured at ' + data.timestamp : '';
      badgeEl.textContent = data.monitor || '';
      badgeEl.className = data.monitor || '';
    }

    function applySettings(data) {
      const c = data.complexity || 1;
      for (let i = 1; i <= 3; i++) {
        document.getElementById('dot-' + i).classList.toggle('active', i <= c);
      }
      document.getElementById('complexity-down').disabled = c <= 1;
      document.getElementById('complexity-up').disabled   = c >= 3;
    }

    async function postComplexity(dir) {
      await fetch('/settings/complexity/' + dir, { method: 'POST' });
    }

    function toggleImage() {
      if (imgEl.classList.contains('hidden')) return;
      wrapEl.classList.toggle('mini');
      wrapEl.classList.toggle('expanded');
    }

    function connect() {
      const es = new EventSource('/stream');

      es.onopen = () => {
        statusEl.textContent = 'live';
        statusEl.className = 'live';
      };

      es.onmessage = e => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'capture') {
            statusEl.textContent = 'working...';
            statusEl.className = 'working';
            applyCapture(data);
            setTimeout(() => { statusEl.textContent = 'live'; statusEl.className = 'live'; }, 600);
          } else if (data.type === 'settings') {
            applySettings(data);
          }
        } catch {}
      };

      es.onerror = () => {
        statusEl.textContent = 'reconnecting...';
        statusEl.className = '';
        es.close();
        setTimeout(connect, 3000);
      };
    }

    const dropdown = document.getElementById('dropdown');
    function toggleMenu(e) {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    }
    document.addEventListener('click', () => dropdown.classList.remove('open'));

    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    connect();
  </script>
</body>
</html>
