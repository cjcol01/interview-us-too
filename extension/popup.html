<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="confirm-overlay" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p class="confirm-title">Start a session?</p>
      <p class="confirm-body">Each time you press <kbd id="confirm-capture-key">Ctrl+Shift+7</kbd> it will send your screen to the AI and consume one token from your plan.</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="confirm-btn">Cancel</button>
        <button id="confirm-ok" class="confirm-btn ok">Got it, turn on</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>Interview Assistant</h1>

    <button id="toggle_enabled" class="toggle-btn off">OFF</button>

    <div class="field">
      <label for="server_url">Server URL</label>
      <input type="url" id="server_url" placeholder="https://yourdomain.com" spellcheck="false">
    </div>

    <div class="field">
      <label for="api_token">API Token</label>
      <div class="input-row">
        <input type="password" id="api_token" placeholder="Paste from Settings page" spellcheck="false">
        <button id="toggle_token" class="icon-btn" title="Show/hide token">&#128065;</button>
      </div>
    </div>

    <div class="row-between">
      <label>Complexity</label>
      <div class="stepper">
        <button id="complexity_down">&#8722;</button>
        <span id="complexity_val">2</span>
        <button id="complexity_up">&#43;</button>
      </div>
    </div>

    <button id="save" class="primary">Save settings</button>

    <div id="status" class="status"></div>

    <div class="mic-section">
      <div class="row-between">
        <label>Mic Input <span id="mic-perm-dot" class="mic-perm-dot"></span></label>
        <button id="mic-test-btn" class="replay-btn">Test</button>
      </div>
      <select id="mic-select">
        <option value="">Default microphone</option>
      </select>
      <div class="mic-meter-wrap" id="mic-meter-wrap" style="display:none;">
        <div id="mic-meter-bar" class="mic-meter-bar"></div>
      </div>
      <button id="grant_mic" class="mic-grant-btn" style="display:none;">Grant mic permission</button>
    </div>

    <div id="replay-section" style="display:none;border-top:1px solid #333;margin-top:10px;padding-top:10px;">
      <div class="row-between" style="margin-bottom:6px;">
        <label style="font-weight:600;font-size:0.85rem;">Instant Replay</label>
        <span id="replay-pill" class="replay-pill idle">Idle</span>
      </div>
      <div class="row-between" style="margin-bottom:4px;">
        <span id="replay-window-label" style="font-size:0.78rem;color:#888;">Window: 10s</span>
        <div>
          <button id="replay-lock-btn" class="replay-btn">Lock to this tab</button>
          <button id="replay-unlock-btn" class="replay-btn secondary" style="display:none;">Unlock</button>
        </div>
      </div>
    </div>

    <p class="hint">Screen&nbsp;<kbd id="hint-capture">Ctrl+Shift+7</kbd>&nbsp;&nbsp;Audio&nbsp;<kbd id="hint-audio">Ctrl+Shift+8</kbd>&nbsp;&nbsp;Toggle&nbsp;<kbd id="hint-toggle">Ctrl+Shift+9</kbd>&nbsp;&nbsp;Replay&nbsp;<kbd id="hint-replay">Ctrl+Shift+6</kbd></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
