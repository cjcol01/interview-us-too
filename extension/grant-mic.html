<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grant Mic Permission</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 40px;
      max-width: 380px;
    }
    h1 { font-size: 1.1rem; margin-bottom: 10px; }
    p  { font-size: 0.85rem; color: #666; line-height: 1.6; margin-bottom: 24px; }
    .status { font-size: 0.9rem; margin-top: 16px; min-height: 1.2em; }
    .ok  { color: #4caf50; }
    .err { color: #e57373; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Microphone Permission</h1>
    <p>Allow mic access in the prompt above so the audio hotkey can record without showing a recording indicator in your interview tab.</p>
    <div id="status" class="status">Waiting for permission prompt...</div>
  </div>
  <script src="grant-mic.js"></script>
</body>
</html>
